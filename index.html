<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Infinite Slide</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Infinite Slide">
<meta name="theme-color" content="#07030f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="stylesheet" href="a2hs/add-to-homescreen.min.css">
<style>
  html, body { margin: 0; height: 100%; background: #07030f; overflow: hidden;
    overscroll-behavior: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; touch-action: none;
    font-family: -apple-system, system-ui, "Helvetica Neue", sans-serif; color: #fff; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; gap: 14px;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: radial-gradient(ellipse at center, rgba(40,10,70,.55), rgba(7,3,15,.92)); z-index: 10; }
  .overlay[hidden] { display: none; }
  h1 { margin: 0; font-size: clamp(28px, 7vh, 56px); font-weight: 800; letter-spacing: .04em;
    background: linear-gradient(90deg, #ff5fb7, #c14bff, #4f7bff, #ff3fd0);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { margin: 0; max-width: 34em; font-size: clamp(13px, 2.6vh, 17px); line-height: 1.4; color: #d9cdf5; }
  button { font: inherit; color: #fff; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #start { font-size: clamp(18px, 4vh, 26px); font-weight: 700; padding: .6em 2.2em; border-radius: 999px;
    background: linear-gradient(90deg, #ff3fa4, #9a4bff); box-shadow: 0 0 28px rgba(255,63,190,.55); }
  .opts { display: flex; gap: 18px; font-size: 13px; color: #b9a9e0; }
  .opts label { display: flex; align-items: center; gap: 6px; }
  #hud { position: fixed; z-index: 11; display: flex; gap: 10px;
    top: max(10px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); }
  #hud[hidden] { display: none; }
  #hud button { width: 44px; height: 44px; border-radius: 50%; padding: 0; margin: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(20,8,40,.45); border: 1px solid rgba(255,255,255,.22);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); opacity: .75; }
  #hud button[hidden] { display: none; }
  #hud svg { width: 22px; height: 22px; display: block; fill: none; stroke: #fff; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  #hud svg .solid { fill: #fff; stroke: none; }
  #paused { background: rgba(7,3,15,.55); z-index: 9; }
  #paused h1 { font-size: clamp(24px, 6vh, 44px); }
  /* Home-screen guide (a2hs/), restyled to match the start screen. */
  .adhs-container, .adhs-container * { font-family: -apple-system, system-ui, "Helvetica Neue", sans-serif !important; }
  .adhs-container.visible { background-color: rgba(7,3,15,.86) !important; }
  .adhs-container .adhs-modal { color: #eadfff !important; border-radius: 22px !important;
    background: radial-gradient(ellipse at top, #3a1466, #12062a 75%) !important;
    border: 1px solid rgba(255,95,183,.45); box-shadow: 0 0 34px rgba(193,75,255,.45) !important; }
  .adhs-container .adhs-modal .adhs-install-app { font-size: 21px !important; line-height: 1.25; text-align: center !important;
    word-spacing: normal !important; letter-spacing: 0; padding: 4px 0 18px !important; margin: 0;
    background: linear-gradient(90deg, #ff5fb7, #c14bff, #6f8fff, #ff3fd0);
    -webkit-background-clip: text; background-clip: text; color: transparent !important; }
  .adhs-container .adhs-modal .adhs-app-name { display: none !important; }
  .adhs-container .adhs-modal .adhs-list .adhs-list-item .adhs-circle { background: linear-gradient(135deg, #ff3fa4, #9a4bff) !important; }
  .adhs-container .adhs-modal .adhs-list .adhs-list-item .adhs-list-button { background: #fff; color: #14082a; box-shadow: 0 0 10px rgba(255,63,190,.5) !important; }
  .adhs-container .adhs-modal .adhs-blurb { color: #b9a9e0 !important; }
  .adhs-container .adhs-logo img { border-radius: 18px !important; box-shadow: 0 0 22px rgba(255,63,190,.6); }
  #toast { position: fixed; z-index: 6; left: 50%; transform: translateX(-50%);
    bottom: max(14px, env(safe-area-inset-bottom)); max-width: 80vw; padding: 8px 16px; border-radius: 14px;
    background: rgba(20,8,40,.7); font-size: 14px; color: #eadfff; text-align: center;
    opacity: 0; transition: opacity .5s; pointer-events: none; }
  #toast.show { opacity: 1; }
  #stage { position: fixed; left: 0; top: 0; width: 100%; height: 100%; transform-origin: top left; overflow: hidden; }
  /* Sideways mode: the phone is locked to portrait, so the whole ride is drawn turned 90 degrees. */
  .rot .overlay { padding: 16px 58px; }
  .rot #hud { top: 14px; right: 58px; }
  .rot #toast { bottom: 14px; }
</style>
</head>
<body>
<div id="stage">
<canvas id="c"></canvas>

<div id="hud">
  <button id="pause" aria-label="Pause" title="Pause" hidden><svg viewBox="0 0 24 24"><path id="pauseIcon" class="solid" d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg></button>
  <button id="turn" aria-label="Turn the view" title="Turn the view"><svg viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 3.5v4h-4"/></svg></button>
  <button id="recenter" aria-label="Re-center tilt" title="Re-center tilt"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5.5"/><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4"/></svg></button>
  <button id="mute" aria-label="Mute sound" title="Mute sound"><svg viewBox="0 0 24 24"><path class="solid" d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path id="muteIcon" d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg></button>
  <button id="fs" aria-label="Full screen" title="Full screen" hidden><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
</div>
<div id="toast"></div>

<div id="paused" class="overlay" hidden>
  <h1>PAUSED</h1>
  <p>Tap the play button to keep riding.</p>
</div>

<div id="intro" class="overlay">
  <h1>INFINITE SLIDE</h1>
  <p>Hold your device sideways the way you want to ride, then tap Start.
     Tilt left and right to steer. Tilt forward to dive and speed up, tilt back to climb and slow down.</p>
  <button id="start">Start</button>
  <div class="opts">
    <label><input type="checkbox" id="invx"> Flip steering</label>
    <label><input type="checkbox" id="invy"> Flip forward / back</label>
  </div>
  <p id="msg" style="font-size:13px;color:#a897d6">On iPhone, turn on rotation lock: the ride always stays sideways.</p>
</div>

</div>

<script src="shader.js"></script>
<script src="audio.js"></script>
<script src="main.js"></script>
<!-- Home-screen walkthrough: philfung/add-to-homescreen 4.6.0 (MIT). Does nothing when already opened from the home screen. -->
<script src="a2hs/add-to-homescreen.min.js"></script>
<script>
  try {
    window.AddToHomeScreenInstance = window.AddToHomeScreen({
      appName: 'Infinite Slide',
      appIconUrl: 'icon-180.png',
      assetUrl: 'a2hs/img/',
      maxModalDisplayCount: 3,
      displayOptions: { showMobile: true, showDesktop: false },
      allowClose: true,
      showArrow: true
    });
    // iPad has its own full-screen button, so the guide is for phones only.
    var isIpad = /iPad/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
    if (!isIpad) {
      window.AddToHomeScreenInstance.show();
      var t = document.querySelector('.adhs-container .adhs-install-app');
      if (t) t.textContent = 'For the best experience, add Infinite Slide to your home screen.';
      // Single-file copy: the guide's pictures are embedded instead of loaded from a2hs/img/.
      if (window.A2HS_IMG) document.querySelectorAll('.adhs-container img').forEach(function (im) {
        var d = window.A2HS_IMG[(im.getAttribute('src') || '').split('/').pop()];
        if (d) im.src = d;
      });
    }
  } catch (e) { console.warn('home-screen guide skipped', e); }
</script>
</body>
</html>
