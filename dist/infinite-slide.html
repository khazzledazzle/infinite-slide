<style>
  html, body { margin: 0; height: 100%; background: #07030f; overflow: hidden;
    overscroll-behavior: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; touch-action: none;
    font-family: -apple-system, system-ui, "Helvetica Neue", sans-serif; color: #fff; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; gap: 14px;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: radial-gradient(ellipse at center, rgba(40,10,70,.55), rgba(7,3,15,.92)); z-index: 10; }
  .overlay[hidden] { display: none; }
  h1 { margin: 0; font-size: clamp(28px, 7vh, 56px); font-weight: 800; letter-spacing: .04em;
    background: linear-gradient(90deg, #ff5fb7, #c14bff, #4f7bff, #ff3fd0);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { margin: 0; max-width: 34em; font-size: clamp(13px, 2.6vh, 17px); line-height: 1.4; color: #d9cdf5; }
  button { font: inherit; color: #fff; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #start { font-size: clamp(18px, 4vh, 26px); font-weight: 700; padding: .6em 2.2em; border-radius: 999px;
    background: linear-gradient(90deg, #ff3fa4, #9a4bff); box-shadow: 0 0 28px rgba(255,63,190,.55); }
  .opts { display: flex; gap: 18px; font-size: 13px; color: #b9a9e0; }
  .opts label { display: flex; align-items: center; gap: 6px; }
  #hud { position: fixed; z-index: 11; display: flex; gap: 10px;
    top: max(10px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); }
  #hud[hidden] { display: none; }
  #hud button { width: 44px; height: 44px; border-radius: 50%; font-size: 19px; line-height: 1;
    background: rgba(20,8,40,.45); border: 1px solid rgba(255,255,255,.22);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); opacity: .75; }
  #hud button[hidden] { display: none; }
  #toast { position: fixed; z-index: 6; left: 50%; transform: translateX(-50%);
    bottom: max(14px, env(safe-area-inset-bottom)); max-width: 80vw; padding: 8px 16px; border-radius: 14px;
    background: rgba(20,8,40,.7); font-size: 14px; color: #eadfff; text-align: center;
    opacity: 0; transition: opacity .5s; pointer-events: none; }
  #toast.show { opacity: 1; }

  .rot .overlay { padding: 16px 58px; }
  .rot #hud { top: 14px; right: 58px; }
  .rot #toast { bottom: 14px; }
</style>

<body>
<div id="stage">
<canvas id="c"></canvas>

<div id="hud">

  <button id="recenter" aria-label="Re-center tilt" title="Re-center tilt">&#8982;</button>
  <button id="mute" aria-label="Mute sound" title="Mute sound">&#128266;</button>
  <button id="fs" aria-label="Full screen" title="Full screen" hidden>&#9974;</button>
</div>
<div id="toast"></div>

<div id="intro" class="overlay">
  <h1>INFINITE SLIDE</h1>
  <p>Hold your device sideways the way you want to ride, then tap Start.
     Tilt left and right to steer. Tilt forward to dive and speed up, tilt back to climb and slow down.</p>
  <button id="start">Start</button>
  <div class="opts">
    <label><input type="checkbox" id="invx"> Flip steering</label>
    <label><input type="checkbox" id="invy"> Flip forward / back</label>
  </div>
  <p id="msg" style="font-size:13px;color:#a897d6">On iPhone, turn on rotation lock: the ride always stays sideways.</p>
</div>

<script>
// Fragment shader for the slide. Everything is drawn on one full-screen triangle:
// each pixel casts a ray down a bending tube of radius 1 and shades what it hits.
window.SLIDE_VERT = `#version 300 es
in vec2 p;
void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;

window.SLIDE_FRAG = `#version 300 es
precision highp float;
uniform vec2  uRes;
uniform float uTime;
uniform float uBase;     // whole rings travelled, wrapped at PERIOD
uniform float uFrac;     // distance into the current ring (world units)
uniform float uSpeed;    // world units per second
uniform float uRoll;
uniform float uYaw;
uniform float uSkyPitch;
uniform vec2  uK;        // how hard the slide bends (x: right, y: up)
uniform vec2  uCam;
uniform vec2  uLook;
out vec4 outColor;

const float PI = 3.14159265;
const float L = 0.8;          // length of one ring of panels
const float NU = 16.0;        // triangles columns around the tube
const float PERIOD = 8192.0;  // ring pattern repeats seamlessly after this many rings
const float CH = 0.92;        // half-angle of the pearly chute at the bottom
const float SC = 168.0 / 8192.0;
const float SCI = 204.0 / 8192.0;

// Weighted toward pink / fuchsia / violet / blue; cyan, mint, orange, yellow are accents.
const vec3 PAL[12] = vec3[12](
  vec3(1.00, 0.36, 0.72),  // pink
  vec3(1.00, 0.10, 0.78),  // fuchsia
  vec3(0.60, 0.26, 1.00),  // violet
  vec3(0.22, 0.38, 1.00),  // blue
  vec3(0.20, 0.85, 1.00),  // cyan accent
  vec3(0.50, 0.30, 1.00),  // violet
  vec3(1.00, 0.20, 0.85),  // fuchsia
  vec3(1.00, 0.50, 0.75),  // pink
  vec3(0.30, 0.45, 1.00),  // blue
  vec3(0.35, 1.00, 0.70),  // mint accent
  vec3(0.72, 0.30, 1.00),  // violet
  vec3(1.00, 0.28, 0.62)); // hot pink

vec3 pal(float x){
  x = mod(x, 12.0);
  float i = floor(x), f = x - i;
  f = f * f * (3.0 - 2.0 * f);
  return mix(PAL[int(i)], PAL[int(mod(i + 1.0, 12.0))], f);
}
float h11(float p){ p = fract(p * 0.1031); p *= p + 33.33; p *= p + p; return fract(p); }
float h21(vec2 p){ vec3 q = fract(vec3(p.xyx) * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }

// Smooth noise along the ride, periodic over PERIOD rings.
float ringNoise(float v, float sp){
  float x = v / sp, i = floor(x), f = x - i;
  f = f * f * (3.0 - 2.0 * f);
  float n = PERIOD / sp;
  return mix(h11(mod(i, n) + sp * 7.3), h11(mod(i + 1.0, n) + sp * 7.3), f);
}
// How far (radians from straight up) the roof is open at ring v. 0 = covered tunnel.
float openAt(float v){
  float n = ringNoise(v, 128.0) * 0.72 + ringNoise(v, 32.0) * 0.28;
  return smoothstep(0.36, 0.66, n) * 2.15;
}
vec3 sceneCol(float vAbs){
  return pal(uTime * 0.07 + vAbs * SC + 1.5 * sin(uTime * 0.013));
}

// a: angle around the tube (0 = bottom, +-PI = top). v: rings ahead of the camera.
// Returns colour and alpha (alpha 0 = hole, the sky shows through).
vec4 surf(float a, float v, float z, float ndv){
  float vAbs = mod(v + uBase, PERIOD);
  vec3 sc = sceneCol(vAbs);
  float aa = abs(a);
  vec3 frameCol = vec3(0.025, 0.012, 0.05) + sc * 0.03;
  float soft = 1.0 + z * 0.12;

  if (aa < CH) {
    // Pearly chute with an iridescent sheen.
    float e = aa / CH;
    vec3 base = vec3(0.40, 0.39, 0.45) * (0.35 + 0.65 * (1.0 - e * e * 0.6));
    vec3 irid = pal(a * 2.4 + vAbs * SCI + uTime * 0.15 + ndv * 3.0);
    float sx = a * 9.0, si = floor(sx), sf = sx - si;
    sf = sf * sf * (3.0 - 2.0 * sf);
    float streak = pow(mix(h11(si + 40.0), h11(si + 41.0), sf), 5.0);
    vec3 col = base * (sc * sc * 1.15 + sc * 0.2 + 0.10) + irid * (0.10 + 0.22 * (1.0 - ndv)) + (irid + 0.3) * streak * 0.30;
    float seam = fract(vAbs / 3.0);
    col *= 1.0 - 0.5 * smoothstep(0.03 * soft, 0.0, min(seam, 1.0 - seam) * 3.0 * L);
    col += sc * 1.6 * smoothstep(CH - 0.06, CH - 0.01, aa);   // glowing lip
    return vec4(col, 1.0);
  }

  float frostTop = 1.22 + 0.5 * ringNoise(vAbs, 32.0);
  float seamGlow = exp(-abs(aa - frostTop) * 34.0);

  if (aa < frostTop) {
    // Lower shell: big frosted panels lit from behind, LED strips in the seams.
    float bh = 0.29;
    float b = floor((aa - CH) / bh);
    float fa = fract((aa - CH) / bh);
    float w = (v + uBase) * 0.5 + 0.5 * mod(b, 2.0);
    float cell = floor(w), f = w - cell;
    vec2 id = vec2(mod(cell, PERIOD * 0.5), b * 2.0 + step(0.0, a) + 11.0);
    float h = h21(id);
    float topD = PI - (CH + (b + 0.5) * bh);
    float cv = mod((cell + 0.5 - 0.5 * mod(b, 2.0)) * 2.0, PERIOD);
    if (topD < openAt(cv) + (h - 0.5) * 0.5) return vec4(0.0);
    float dv = min(f, 1.0 - f) * 2.0 * L;
    float da = min(fa, 1.0 - fa) * bh;
    float d = min(dv, da);
    float glass = smoothstep(0.018 * soft, 0.034 * soft, d);
    vec3 col = (sc * sc * 0.80 + sc * 0.12 + 0.02) * (0.62 + 0.38 * h) * (0.75 + 0.25 * smoothstep(0.0, 0.12, d));
    col = mix(frameCol, col, glass);
    col += sc * 1.5 * exp(-da * 46.0);
    col += sc * 2.4 * seamGlow;
    return vec4(col, 1.0);
  }

  // Upper body: triangular dichroic glass in dark frames.
  float u = (a + PI) / (2.0 * PI) * NU;
  float sh = mod(0.5 * uBase, NU);
  float qx = u - 0.5 * v - sh;
  float ci = floor(qx), cj = floor(v);
  vec2 f = vec2(qx - ci, v - cj);
  float up = step(1.0, f.x + f.y);
  vec2 cen = mix(vec2(1.0 / 3.0), vec2(2.0 / 3.0), up);
  float d = up > 0.5
    ? min(min(1.0 - f.x, 1.0 - f.y), (f.x + f.y - 1.0) * 0.707)
    : min(min(f.x, f.y), (1.0 - f.x - f.y) * 0.707);
  float vc = cj + cen.y;
  float ucm = mod(ci + cen.x + 0.5 * vc + sh, NU);
  float topD = min(ucm, NU - ucm) * (2.0 * PI / NU);
  vec2 id = vec2(mod(ci, NU) + up * 37.0, mod(cj + uBase, PERIOD));
  float h = h21(id), h2 = h21(id + 71.3), h3 = h21(id + 13.7);
  float edge = topD - openAt(mod(vc + uBase, PERIOD)) - (h - 0.5) * 0.7;
  float frame = 1.0 - smoothstep(0.034 * soft, 0.058 * soft, d);
  if (edge < 0.0) {
    // Roof is open here. Near the opening a bare skeleton of frames remains.
    if (edge > -0.32 && h2 > 0.35 && frame > 0.5) return vec4(frameCol + sc * 0.05, 1.0);
    return vec4(0.0);
  }
  vec3 g = pal(h * 12.0 + (1.0 - ndv) * 2.5 + uTime * 0.05 + 0.3 * sin(uTime * 0.2 + h * 40.0));
  if (h2 > 0.80) g = mix(vec3(1.0, 0.50, 0.10), vec3(1.0, 0.86, 0.22), h3);   // orange / yellow accents
  float bright = h2 < 0.10 ? 0.10 : 0.35 + 0.65 * h3;
  vec3 col = (g * g * 0.80 + sc * 0.12) * bright * (0.55 + 0.45 * smoothstep(0.0, 0.3, d));
  col = mix(col, frameCol, frame);
  col += sc * 2.4 * seamGlow;
  return vec4(col, 1.0);
}

vec3 rotSky(vec3 d){
  float cp = cos(uSkyPitch), sp = sin(uSkyPitch);
  d = vec3(d.x, d.y * cp - d.z * sp, d.y * sp + d.z * cp);
  float cy = cos(uYaw), sy = sin(uYaw);
  return vec3(d.x * cy + d.z * sy, d.y, -d.x * sy + d.z * cy);
}
float starLayer(vec2 sp, float seed){
  vec2 cell = floor(sp), f = fract(sp) - 0.5;
  vec2 off = (vec2(h21(cell + seed), h21(cell + seed + 9.1)) - 0.5) * 0.7;
  float b = h21(cell + seed + 3.3);
  float tw = 0.6 + 0.4 * sin(uTime * (1.0 + b * 3.0) + b * 50.0);
  return smoothstep(0.085, 0.0, length(f - off)) * step(0.72, b) * (0.5 + 1.8 * b * b) * tw;
}
vec3 sky(vec3 d){
  d = rotSky(d);
  vec2 sp = vec2(atan(d.x, d.z), asin(clamp(d.y, -1.0, 1.0)));
  float st = starLayer(sp * 22.0, 0.0) + 0.6 * starLayer(sp * 41.0, 17.0);
  vec3 haze = pal(sp.x * 0.9 + uTime * 0.02) * (0.003 + 0.010 * smoothstep(0.7, -0.2, d.y));
  return vec3(0.002, 0.0015, 0.008) + haze + vec3(0.85, 0.88, 1.0) * st;
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  float cr = cos(uRoll), sr = sin(uRoll);
  uv = vec2(uv.x * cr - uv.y * sr, uv.x * sr + uv.y * cr);
  const float F = 0.8;
  vec3 d = normalize(vec3(uv + uLook, F));
  vec2 m = d.xy / max(d.z, 0.05);
  float dither = h21(gl_FragCoord.xy + fract(uTime) * 91.7);

  // Sky, with stars stretched away from the centre as speed rises.
  vec3 skyCol = vec3(0.0);
  float sb = uSpeed * 0.0012;
  for (int j = 0; j < 4; j++) {
    float t = (float(j) + dither) / 4.0;
    skyCol += sky(normalize(vec3(uv * (1.0 - sb * t) + uLook, F)));
  }
  skyCol *= 0.25;

  // Find where this ray meets the tube wall.
  float z0 = 0.0, z1 = -1.0;
  for (int i = 1; i <= 56; i++) {
    float fi = float(i);
    float z = 0.15 * fi + 0.012 * fi * fi;
    if (length(uCam + m * z - uK * z * z) > 1.0) { z1 = z; break; }
    z0 = z;
  }
  vec3 col;
  if (z1 < 0.0) {
    col = sceneCol(mod(46.0 / L + uBase, PERIOD)) * 0.22;
  } else {
    for (int i = 0; i < 6; i++) {
      float zm = 0.5 * (z0 + z1);
      if (length(uCam + m * zm - uK * zm * zm) > 1.0) z1 = zm; else z0 = zm;
    }
    float z = 0.5 * (z0 + z1);
    vec2 P = uCam + m * z - uK * z * z;
    float a = atan(P.x, -P.y);
    float ndv = clamp(abs(dot(normalize(vec3(m, 1.0)), vec3(normalize(P), 0.0))) * 2.5, 0.0, 1.0);
    float v = (z + uFrac) / L;

    // Motion blur: smear the surface along the direction of travel, longer when faster.
    float blur = uSpeed * 0.017 / L;
    vec3 acc = vec3(0.0);
    for (int j = 0; j < 6; j++) {
      vec4 s = surf(a, v + (float(j) + dither) / 6.0 * blur, z, ndv);
      acc += mix(skyCol, s.rgb, s.a);
    }
    col = acc / 6.0;
    float fog = 1.0 - exp(-z * 0.05);
    col = mix(col, sceneCol(mod(v + uBase, PERIOD)) * 0.10 + skyCol * 0.5, fog * 0.85);
  }

  float vig = 1.0 - 0.32 * dot(uv, uv);
  col *= vig;
  col = 1.0 - exp(-col * 1.35);
  col = pow(col, vec3(0.4545));
  col += (dither - 0.5) / 255.0;
  outColor = vec4(col, 1.0);
}`;

</script>
<script>
// All sound is generated in the browser: a wind whoosh that follows speed,
// plus slow evolving pad chords and sparse bell notes.
window.SlideAudio = (function () {
  let ctx = null, master, musicBus, whooshGain, whooshFilter, hissGain, padFilter, delay;
  let muted = false, timer = null;
  let nextChord = 0, nextNote = 0, chordIdx = 0, melodyPos = 2;

  const midi = (n) => 440 * Math.pow(2, (n - 69) / 12);
  // D major family. Each chord: bass note, then pad voicing.
  const CHORDS = [
    { bass: 38, notes: [57, 62, 66, 69, 73] },  // Dmaj7
    { bass: 35, notes: [57, 59, 62, 66, 69] },  // Bm7
    { bass: 43, notes: [55, 59, 62, 66, 69] },  // Gmaj7
    { bass: 45, notes: [57, 61, 64, 66, 71] },  // A6/9
    { bass: 42, notes: [57, 61, 64, 66, 69] },  // F#m7
    { bass: 40, notes: [55, 59, 62, 66, 71] },  // Em9
  ];
  const NEXT = [[1, 2, 4], [2, 5, 0], [0, 3, 5], [0, 1, 4], [1, 2], [3, 0, 2]];
  const SCALE = [62, 64, 66, 69, 71, 74, 76, 78, 81, 83, 86];  // D major pentatonic

  function init() {
    if (ctx) { ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 4;
    master = ctx.createGain();
    master.gain.value = muted ? 0 : 0.9;
    master.connect(comp).connect(ctx.destination);

    // Whoosh: looped noise through a band-pass that opens with speed.
    const len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate), data = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = last * 0.6 + w * 0.4; data[i] = last * 1.6; }
    const noise = ctx.createBufferSource(); noise.buffer = buf; noise.loop = true;
    whooshFilter = ctx.createBiquadFilter(); whooshFilter.type = 'bandpass'; whooshFilter.Q.value = 0.7;
    whooshGain = ctx.createGain(); whooshGain.gain.value = 0;
    const hissFilter = ctx.createBiquadFilter(); hissFilter.type = 'highpass'; hissFilter.frequency.value = 3500;
    hissGain = ctx.createGain(); hissGain.gain.value = 0;
    noise.connect(whooshFilter).connect(whooshGain).connect(master);
    noise.connect(hissFilter).connect(hissGain).connect(master);
    noise.start();

    // Music bus with a soft echo.
    musicBus = ctx.createGain(); musicBus.gain.value = 0.55;
    padFilter = ctx.createBiquadFilter(); padFilter.type = 'lowpass'; padFilter.frequency.value = 900; padFilter.Q.value = 0.5;
    delay = ctx.createDelay(1.5); delay.delayTime.value = 0.42;
    const fb = ctx.createGain(); fb.gain.value = 0.42;
    const wet = ctx.createGain(); wet.gain.value = 0.35;
    const dlp = ctx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2200;
    delay.connect(dlp).connect(fb).connect(delay);
    dlp.connect(wet).connect(musicBus);
    padFilter.connect(musicBus);
    musicBus.connect(master);

    nextChord = ctx.currentTime + 0.1;
    nextNote = ctx.currentTime + 3;
    timer = setInterval(schedule, 200);
  }

  function voice(dest, type, freq, t, attack, hold, release, peak, detune) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq; o.detune.value = detune || 0;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(peak, t + attack);
    g.gain.setValueAtTime(peak, t + attack + hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + hold + release);
    o.connect(g).connect(dest);
    o.start(t); o.stop(t + attack + hold + release + 0.1);
  }

  function schedule() {
    if (!ctx || ctx.state !== 'running') return;
    const horizon = ctx.currentTime + 0.6;
    while (nextChord < horizon) {
      const c = CHORDS[chordIdx], dur = 9 + Math.random() * 4;
      c.notes.forEach((n, i) => {
        if (Math.random() < 0.15) return;                       // leave notes out now and then
        const f = midi(n + (Math.random() < 0.2 ? 12 : 0));
        voice(padFilter, 'sawtooth', f, nextChord + i * 0.3, 3.5, dur - 4, 5.5, 0.030, -7);
        voice(padFilter, 'triangle', f, nextChord + i * 0.3, 3.5, dur - 4, 5.5, 0.045, 6);
      });
      voice(musicBus, 'sine', midi(c.bass), nextChord, 2.5, dur - 3, 4, 0.16, 0);
      const opts = NEXT[chordIdx];
      chordIdx = opts[Math.floor(Math.random() * opts.length)];
      nextChord += dur;
    }
    while (nextNote < horizon) {
      melodyPos += Math.floor(Math.random() * 5) - 2;
      melodyPos = Math.max(0, Math.min(SCALE.length - 1, melodyPos));
      const f = midi(SCALE[melodyPos]), g = 0.05 + Math.random() * 0.04;
      [musicBus, delay].forEach((dst) => {
        voice(dst, 'sine', f, nextNote, 0.02, 0.05, 2.2, g, 0);
        voice(dst, 'triangle', f * 2, nextNote, 0.01, 0.02, 0.9, g * 0.25, 3);
      });
      const r = Math.random();
      nextNote += r < 0.25 ? 0.42 : r < 0.6 ? 0.84 : r < 0.85 ? 1.68 : 3.4 + Math.random() * 3;
    }
  }

  // n: speed from 0 (floor) to 1 (ceiling).
  function setSpeed(n) {
    if (!ctx) return;
    const t = ctx.currentTime;
    whooshFilter.frequency.setTargetAtTime(260 + n * 1900, t, 0.12);
    whooshGain.gain.setTargetAtTime(0.03 + n * n * 0.42, t, 0.12);
    hissGain.gain.setTargetAtTime(n * n * n * 0.07, t, 0.12);
    padFilter.frequency.setTargetAtTime(750 + n * 900, t, 0.5);
  }
  function setMuted(m) {
    muted = m;
    if (ctx) master.gain.setTargetAtTime(m ? 0 : 0.9, ctx.currentTime, 0.05);
  }
  function pause(p) { if (ctx) (p ? ctx.suspend() : ctx.resume()); }
  return { init, setSpeed, setMuted, pause, get muted() { return muted; }, get state() { return ctx ? ctx.state : 'none'; } };
})();

</script>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const canvas = $('c'), intro = $('intro'), hud = $('hud'), toastEl = $('toast'), msg = $('msg');
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

  // ---------- tuning ----------
  const L = 0.8, PERIOD = 8192;
  const V_MIN = 4, V_MAX = 46, V_START = 13, ACCEL = 11;
  const K_MAX = 0.03;                       // strongest bend
  const DEAD_STEER = 3, MAX_STEER = 28;     // degrees of tilt
  const DEAD_PITCH = 4, MAX_PITCH = 26;

  // ---------- WebGL ----------
  const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });
  if (!gl) { msg.textContent = 'This browser cannot draw the slide (WebGL2 is missing). Update iOS and try again.'; $('start').disabled = true; return; }
  function compile(type, src) {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, window.SLIDE_VERT));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, window.SLIDE_FRAG));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = {};
  ['uRes', 'uTime', 'uBase', 'uFrac', 'uSpeed', 'uRoll', 'uYaw', 'uSkyPitch', 'uK', 'uCam', 'uLook']
    .forEach((n) => { U[n] = gl.getUniformLocation(prog, n); });

  let scale = Math.min(window.devicePixelRatio || 1, 1.5);   // lowered automatically if frames run slow
  function resize() {
    const w = Math.max(1, Math.round(canvas.clientWidth * scale)), h = Math.max(1, Math.round(canvas.clientHeight * scale));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); }
  }

  // ---------- sideways mode ----------
  // iOS will not let a page force landscape. When a touch device is upright (for example with
  // rotation lock on), draw everything turned 90 degrees so it is ridden sideways anyway.
  const stage = $('stage');
  const coarse = matchMedia('(pointer: coarse)').matches;
  let rot = 0;             // 0 = normal, 90 / -90 = drawn turned (device-rotation angle it matches)
  let rotPick = 90;        // which way to turn; set from gravity at Start
  let manual = null;       // set by the turn button: 0, 90 or -90. null = automatic
  function layout() {
    const w = innerWidth, h = innerHeight;
    rot = manual !== null ? manual : (coarse && h > w) ? rotPick : 0;
    document.documentElement.classList.toggle('rot', rot !== 0);
    if (!rot) { stage.style.width = '100%'; stage.style.height = '100%'; stage.style.transform = 'none'; return; }
    stage.style.width = h + 'px'; stage.style.height = w + 'px';
    stage.style.transform = rot === 90 ? 'translateX(' + w + 'px) rotate(90deg)' : 'translateY(' + h + 'px) rotate(-90deg)';
  }
  addEventListener('resize', layout);
  if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', layout);
  layout();

  // ---------- state ----------
  const S = { running: false, speed: V_START, dist: 290, steer: 0, pitch: 0, yaw: 0, time: 0, tilt: false, input: 'none' };
  window.__slide = S;

  // ---------- input: tilt ----------
  const tilt = { x: 0, y: 0, live: false, zero: null, raw: null };
  let invX = false, invY = false;
  try { invX = localStorage.getItem('slide.invx') === '1'; invY = localStorage.getItem('slide.invy') === '1'; } catch (e) {}
  $('invx').checked = invX; $('invy').checked = invY;
  $('invx').onchange = (e) => { invX = e.target.checked; try { localStorage.setItem('slide.invx', invX ? '1' : '0'); } catch (x) {} };
  $('invy').onchange = (e) => { invY = e.target.checked; try { localStorage.setItem('slide.invy', invY ? '1' : '0'); } catch (x) {} };

  function screenAngle() {
    if (typeof window.orientation === 'number') return window.orientation;
    if (screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle;
    return 0;
  }
  function onMotion(e) {
    const g = e.accelerationIncludingGravity;
    if (!g || g.x == null || g.y == null || g.z == null) return;
    if (rot && manual === null && !tilt.zero) {
      // Work out which long edge is down so the picture is drawn the right way up.
      const sgn = Math.abs(g.z) > 2 ? (g.z > 0 ? -1 : 1) : 1;
      const pick = g.x * sgn < 0 ? 90 : -90;
      if (pick !== rotPick && Math.abs(g.x) > 3) { rotPick = pick; layout(); }
    }
    const th = (rot || screenAngle()) * Math.PI / 180;
    let sx = g.x * Math.cos(th) - g.y * Math.sin(th);
    let sy = g.x * Math.sin(th) + g.y * Math.cos(th);
    let sz = g.z;
    const n = Math.hypot(sx, sy, sz);
    if (n < 1) return;
    sx /= n; sy /= n; sz /= n;
    // Low-pass the raw vector to take out hand shake.
    if (!tilt.raw) tilt.raw = [sx, sy, sz];
    else { tilt.raw[0] += (sx - tilt.raw[0]) * 0.25; tilt.raw[1] += (sy - tilt.raw[1]) * 0.25; tilt.raw[2] += (sz - tilt.raw[2]) * 0.25; }
    if (!tilt.zero) {
      // Browsers disagree on the sign of this reading. The screen is never facing the floor
      // while someone is looking at it, so use that to pick the sign, then remember neutral.
      const sign = (tilt.raw[1] + tilt.raw[2]) > 0 ? -1 : 1;
      const z = angles(tilt.raw, sign);
      tilt.zero = { sign, steer: z.steer, pitch: z.pitch };
    }
    const a = angles(tilt.raw, tilt.zero.sign);
    let ds = (a.steer - tilt.zero.steer) * 180 / Math.PI;
    let dp = a.pitch - tilt.zero.pitch;
    dp = Math.atan2(Math.sin(dp), Math.cos(dp)) * 180 / Math.PI;
    tilt.x = shape(ds, DEAD_STEER, MAX_STEER) * (invX ? -1 : 1);
    tilt.y = shape(dp, DEAD_PITCH, MAX_PITCH) * (invY ? -1 : 1);
    tilt.live = true; S.tilt = true;
  }
  // Gravity direction in screen axes (x right, y up, z toward the viewer).
  function angles(v, sign) {
    const gx = v[0] * sign, gy = v[1] * sign, gz = v[2] * sign;
    return { steer: Math.asin(clamp(gx, -1, 1)), pitch: Math.atan2(-gz, -gy) };
  }
  function shape(deg, dead, max) {
    const m = Math.abs(deg);
    if (m <= dead) return 0;
    return Math.sign(deg) * clamp((m - dead) / (max - dead), 0, 1);
  }
  function recenter() { tilt.zero = null; toast(tilt.live ? 'Re-centered' : 'Tilt is not active on this device'); }

  // ---------- input: touch drag and keys ----------
  const ptr = { down: false, id: null, x0: 0, y0: 0, x: 0, y: 0 };
  canvas.addEventListener('pointerdown', (e) => {
    if (ptr.down) return;
    ptr.down = true; ptr.id = e.pointerId; ptr.x0 = e.clientX; ptr.y0 = e.clientY; ptr.x = 0; ptr.y = 0;
    try { canvas.setPointerCapture(e.pointerId); } catch (x) {}
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!ptr.down || e.pointerId !== ptr.id) return;
    let dx = e.clientX - ptr.x0, dy = e.clientY - ptr.y0;
    if (rot === 90) { const t = dx; dx = dy; dy = -t; } else if (rot === -90) { const t = dx; dx = -dy; dy = t; }
    ptr.x = clamp(dx / (stage.clientWidth * 0.22), -1, 1);
    ptr.y = clamp(-dy / (stage.clientHeight * 0.28), -1, 1);
  });
  const up = (e) => { if (e.pointerId === ptr.id) { ptr.down = false; ptr.x = ptr.y = 0; } };
  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
  ['touchmove', 'gesturestart', 'contextmenu'].forEach((t) => document.addEventListener(t, (e) => e.preventDefault(), { passive: false }));

  const keys = {};
  const KEYMAP = { ArrowLeft: 'l', ArrowRight: 'r', ArrowUp: 'f', ArrowDown: 'b', a: 'l', d: 'r', w: 'f', s: 'b' };
  addEventListener('keydown', (e) => { const k = KEYMAP[e.key]; if (k) { keys[k] = true; e.preventDefault(); } if (e.key === 'm') toggleMute(); });
  addEventListener('keyup', (e) => { const k = KEYMAP[e.key]; if (k) keys[k] = false; });

  function readInput() {
    if (ptr.down) { S.input = 'touch'; return [ptr.x, ptr.y]; }
    const kx = (keys.r ? 1 : 0) - (keys.l ? 1 : 0), ky = (keys.f ? 1 : 0) - (keys.b ? 1 : 0);
    if (kx || ky) { S.input = 'keys'; return [kx, ky]; }
    if (tilt.live) { S.input = 'tilt'; return [tilt.x, tilt.y]; }
    S.input = 'none'; return [0, 0];
  }

  // ---------- UI ----------
  let toastTimer = 0;
  function toast(text, ms) {
    toastEl.textContent = text; toastEl.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms || 2600);
  }
  function toggleMute() {
    SlideAudio.setMuted(!SlideAudio.muted);
    $('mute').innerHTML = SlideAudio.muted ? '&#128263;' : '&#128266;';
  }
  $('mute').onclick = toggleMute;
  $('recenter').onclick = recenter;
  // Turn button: each tap turns the picture a quarter turn, then re-centers tilt for the new grip.
  $('turn').onclick = () => {
    const order = [0, 90, -90];
    manual = order[(order.indexOf(rot) + 1) % 3];
    layout();
    tilt.zero = null;
    toast(manual === 0 ? 'View: upright' : 'View: turned sideways. Hold it how you want, then tap re-center.');
  };

  const root = document.documentElement;
  const reqFS = root.requestFullscreen || root.webkitRequestFullscreen;
  const standalone = navigator.standalone === true || matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches;
  if (reqFS && !standalone && (document.fullscreenEnabled || document.webkitFullscreenEnabled)) {
    $('fs').hidden = false;
    $('fs').onclick = () => {
      const el = document.fullscreenElement || document.webkitFullscreenElement;
      if (el) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else { const p = reqFS.call(root); if (p && p.catch) p.catch(() => toast('Full screen is not available here')); }
    };
  }

  let wake = null;
  async function keepAwake() {
    try { if ('wakeLock' in navigator && document.visibilityState === 'visible') wake = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => {
    const hidden = document.visibilityState !== 'visible';
    SlideAudio.pause(hidden || !S.running);
    if (!hidden && S.running) keepAwake();
    lastT = 0;
  });

  async function start() {
    let denied = false;
    // iOS only allows these two requests from inside a tap.
    try {
      if (window.SLIDE_NO_TILT) { /* host blocks motion sensors */ }
      else if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === 'function') {
        const r = await DeviceMotionEvent.requestPermission();
        if (r !== 'granted') denied = true;
      }
    } catch (e) { denied = true; }
    if (!denied && !window.SLIDE_NO_TILT) addEventListener('devicemotion', onMotion);
    SlideAudio.init();
    keepAwake();
    tilt.zero = null;
    intro.hidden = true; S.running = true;
    if (window.SLIDE_NO_TILT) toast('Drag on the screen to steer: up to dive and speed up, down to climb and slow down.', 7000);
    else if (denied) toast('Tilt was not allowed. Drag on the screen to steer. To turn tilt on, reload the page, tap Start, then Allow.', 9000);
    else setTimeout(() => { if (S.running && !tilt.live) toast('No tilt sensor found. Drag on the screen or use the arrow keys.', 6000); }, 1500);
  }
  $('start').onclick = start;

  // ---------- main loop ----------
  let lastT = 0, slow = 0, frames = 0;
  function frame(t) {
    requestAnimationFrame(frame);
    const dt = lastT ? Math.min((t - lastT) / 1000, 0.05) : 0.016;
    if (lastT && S.running) {
      // Drop resolution a step if the device cannot hold the frame rate.
      frames++; if (t - lastT > 24) slow++;
      if (frames >= 90) { if (slow > 45 && scale > 0.6) scale = Math.max(0.6, scale * 0.8); frames = slow = 0; }
    }
    lastT = t;
    resize();

    const inp = S.running ? readInput() : [0, 0];
    const ease = 1 - Math.exp(-dt * 5);
    S.steer += (inp[0] - S.steer) * ease;
    S.pitch += (inp[1] - S.pitch) * ease;
    if (S.running) S.speed = clamp(S.speed + inp[1] * ACCEL * dt, V_MIN, V_MAX);
    const v = S.running ? S.speed : 6;       // slow drift behind the start screen
    S.dist += v * dt;
    S.time += dt;
    const kx = S.steer * K_MAX, ky = -S.pitch * K_MAX;
    S.yaw += 2 * kx * v * dt;

    const rings = S.dist / L, base = Math.floor(rings);
    gl.uniform2f(U.uRes, canvas.width, canvas.height);
    gl.uniform1f(U.uTime, S.time % 3600);
    gl.uniform1f(U.uBase, base % PERIOD);
    gl.uniform1f(U.uFrac, (rings - base) * L);
    gl.uniform1f(U.uSpeed, v);
    gl.uniform1f(U.uRoll, S.steer * 0.2);
    gl.uniform1f(U.uYaw, S.yaw % (Math.PI * 2));
    gl.uniform1f(U.uSkyPitch, -S.pitch * 0.25);
    gl.uniform2f(U.uK, kx, ky);
    gl.uniform2f(U.uCam, -S.steer * 0.22, -0.5);
    gl.uniform2f(U.uLook, kx * 7, ky * 7 + 0.06);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    if (S.running) SlideAudio.setSpeed((S.speed - V_MIN) / (V_MAX - V_MIN));
  }
  requestAnimationFrame(frame);
})();

</script>
</body>
</html>
